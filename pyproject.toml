[project]
name = "lamina"
version = "0.1.0"
description = "Dibujos para el chat de estudio: fórmulas, polos y ceros, Bode, circuitos y bloques, con el diseño Nord del ecosistema"
readme = "README.md"
authors = [{ name = "Juanma" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "resvg-py>=0.5.0",
    "schemdraw>=0.23",
    "ziamath>=0.13",
]

[project.scripts]
lamina = "lamina.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
